<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Smart Job Tracker
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        .timeline {
            position: relative;
            margin-left: 10px;
            padding-left: 30px;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 25px;
        }

        .timeline-item:not(:last-child)::before {
            content: "";
            position: absolute;
            left: -21px;
            top: 24px;
            width: 2px;
            height: calc(100% - 5px);
            background-color: #dee2e6;
        }

        .timeline-dot {
            position: absolute;
            left: -28px;
            top: 4px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

    </style>

</head>


<body>

    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Website Logo / Brand -->

            <a
                class="navbar-brand"
                href="{% url 'home' %}"
            >
                Smart Job Tracker
            </a>


            <!-- Mobile Menu Button -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation Links -->

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-auto">

                    <!-- Home -->

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{% url 'home' %}"
                        >
                            Home
                        </a>

                    </li>


                    <!-- Check Login Status -->

                    {% if user.is_authenticated %}


                        <!-- My Applications -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="{% url 'job_list' %}"
                            >
                                My Applications
                            </a>

                        </li>


                        <!-- Add Job -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="{% url 'add_job' %}"
                            >
                                Add Job
                            </a>

                        </li>


                        <!-- Username -->

                        <li class="nav-item">

                            <span class="nav-link">
                                Welcome, {{ user.username }}
                            </span>

                        </li>


                        <!-- Logout -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="{% url 'logout' %}"
                            >
                                Logout
                            </a>

                        </li>


                    {% else %}


                        <!-- Register -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="{% url 'register' %}"
                            >
                                Register
                            </a>

                        </li>


                        <!-- Login -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="{% url 'login' %}"
                            >
                                Login
                            </a>

                        </li>


                    {% endif %}

                </ul>

            </div>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container mt-5">

        {% block content %}

        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
